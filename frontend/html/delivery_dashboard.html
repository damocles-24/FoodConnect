<!DOCTYPE html>
<html lang="en" data-default-theme="light">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/damocles-24/IMAGES/refs/heads/main/05f3b888-5229-477b-87a0-0b27c7ddee38%20(1)-Photoroom.png">


  <title>FoodConnect | Delivery Staff</title>

  <link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/ph-phone.css?v=20260816">
  <link rel="stylesheet" href="../css/foodconnect-theme.css?v=20260817-semantic1">
  <link rel="stylesheet" href="../css/delivery_dashboard.css?v=20260817-delivery-polish2">
  <script src="../js/foodconnect-theme.js?v=20260817-7" defer></script>
</head>

<body data-fc-page="delivery">

  <div class="delivery-app">

    <!-- HEADER -->
    <header class="delivery-header">

      <div class="brand-area">
        <span class="delivery-logo-shell" aria-hidden="true">
          <img
            src="https://raw.githubusercontent.com/damocles-24/IMAGES/refs/heads/main/logofoodconnect.png"
            alt=""
            class="delivery-logo"
          />
        </span>

        <div>
          <h1 class="foodconnect-brand"><span class="brand-food">Food</span><span class="brand-connect">Connect</span></h1>
          <p>Delivery Staff</p>
        </div>
      </div>

      <div class="delivery-header-actions">
        <button
          type="button"
          class="theme-icon-toggle"
          data-theme-toggle
          aria-label="Switch to dark mode"
          title="Switch to dark mode"
        >
          <svg class="theme-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20.5 15.1A8.5 8.5 0 0 1 8.9 3.5 8.5 8.5 0 1 0 20.5 15.1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          <svg class="theme-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>

        <div class="delivery-user-chip" aria-label="Signed-in delivery staff">
          <i class="fa-solid fa-user"></i>
          <span id="deliveryHeaderName">Delivery Staff</span>
        </div>

        <button
          class="logout-btn"
          id="logoutBtn"
          title="Logout"
          aria-label="Logout"
        >
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>

    </header>

    <!-- RIDER INFORMATION -->
    <section class="rider-panel">

      <div class="rider-avatar">
        <i class="fa-solid fa-motorcycle"></i>
      </div>

      <div class="rider-info">
        <span>Logged in as</span>
        <h2 id="riderName">Delivery Staff</h2>
        <p id="riderStatus">
          Ready to receive deliveries
        </p>
      </div>

      <button
        class="refresh-btn"
        id="refreshDeliveriesBtn"
      >
        <i class="fa-solid fa-rotate"></i>
        Refresh
      </button>

    </section>

    <!-- SUMMARY -->
    <section class="delivery-summary">

      <div class="summary-card">
        <i class="fa-solid fa-box"></i>

        <div>
          <span>Assigned</span>
          <strong id="assignedCount">0</strong>
        </div>
      </div>

      <div class="summary-card">
        <i class="fa-solid fa-person-biking"></i>

        <div>
          <span>Ongoing</span>
          <strong id="ongoingCount">0</strong>
        </div>
      </div>

      <div class="summary-card">
        <i class="fa-solid fa-circle-check"></i>

        <div>
          <span>Completed</span>
          <strong id="completedCount">0</strong>
        </div>
      </div>

    </section>

    <!-- FILTER TABS -->
    <section class="delivery-tabs">

      <button
        class="delivery-tab active"
        data-status="active"
      >
        Active
      </button>

      <button
        class="delivery-tab"
        data-status="completed"
      >
        Completed
      </button>

      <button
        class="delivery-tab"
        data-status="all"
      >
        All
      </button>

    </section>

    <!-- DELIVERY LIST -->
    <main class="delivery-content">

      <div
        class="delivery-list"
        id="deliveryList"
      >
        <div class="delivery-empty-state">
          <i class="fa-solid fa-motorcycle"></i>
          <h3>No Deliveries Yet</h3>
          <p>
            Assigned delivery orders will appear here.
          </p>
        </div>
      </div>

    </main>

  </div>

  <!-- DELIVERY DETAILS MODAL -->
  <div
    class="modal-overlay"
    id="deliveryModal"
  >

    <div class="delivery-modal">

      <div class="modal-header">

        <div>
          <h2>Delivery Details</h2>
          <p id="deliveryModalSubtitle">
            Customer and order information
          </p>
        </div>

        <button
          class="close-modal-btn"
          id="closeDeliveryModal"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>

      <div
        class="modal-body"
        id="deliveryModalBody"
      >
        <!-- Filled by JavaScript -->
      </div>

      <div class="modal-footer">

        <button
          class="secondary-btn"
          id="closeDeliveryModalBtn"
        >
          Close
        </button>

        <div
          class="delivery-actions"
          id="deliveryActions"
        >
          <!-- Dynamic action buttons -->
        </div>

      </div>

    </div>

  </div>

  <!-- CONFIRMATION MODAL -->
  <div
    class="modal-overlay"
    id="confirmModal"
  >

    <div class="confirm-modal">

      <div class="confirm-icon">
        <i class="fa-solid fa-circle-question"></i>
      </div>

      <h3 id="confirmTitle">
        Confirm Action
      </h3>

      <p id="confirmMessage">
        Are you sure?
      </p>

      <div class="confirm-actions">

        <button
          class="secondary-btn"
          id="confirmCancelBtn"
        >
          Cancel
        </button>

        <button
          class="primary-btn"
          id="confirmOkBtn"
        >
          Confirm
        </button>

      </div>

    </div>

  </div>

  <!-- TOASTS -->
  <div
    class="toast-container"
    id="toastContainer"
  ></div>

  <script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

  <script src="../js/ph-phone.js?v=20260816"></script>
<script src="../js/delivery_dashboard.js"></script>

</body>
</html>
