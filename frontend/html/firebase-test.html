<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/damocles-24/IMAGES/refs/heads/main/logofoodconnect-Photoroom.png">
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FoodConnect Firebase Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
      color: #18181b;
      font-family: Arial, sans-serif;
    }

    .test-card {
      width: 100%;
      max-width: 520px;
      padding: 28px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.1);
    }

    .test-badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #fff0e6;
      color: #ea580c;
      font-size: 13px;
      font-weight: 700;
    }

    hr {
  margin: 18px 0;
  border: 0;
  border-top: 1px solid #e4e4e7;
}

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      line-height: 1.6;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
      background: #fafafa;
    }

    .user-id {
      display: block;
      margin-top: 8px;
      overflow-wrap: anywhere;
      font-family: monospace;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="test-card">
    <span class="test-badge">
      Phase 2 Foundation Test
    </span>

    <h1>Firebase Connection Test</h1>

    <p>
      This page checks whether FoodConnect can connect
      to Firebase Authentication.
    </p>

    <section class="result">
      <strong>Status:</strong>

      <p id="firebaseTestStatus">
        Initializing Firebase...
      </p>

      <strong>Anonymous Firebase UID:</strong>

<span
  id="firebaseTestUserId"
  class="user-id"
>
  Waiting...
</span>

<hr>

<strong>Database write:</strong>

<p id="firebaseWriteResult">
  Waiting...
</p>

<strong>Database read:</strong>

<p id="firebaseReadResult">
  Waiting...
</p>

<strong>Test cleanup:</strong>

<p id="firebaseCleanupResult">
  Waiting...
</p>
    </section>
  </main>

  <script
    type="module"
    src="../js/firebase-connection-test.js"
  ></script>
</body>
</html>
